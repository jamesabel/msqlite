[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[project]
name = "msqlite"
version = "1.0.1"
description = "SQLite access that is safe across threads and processes: bounded, retried locking with WAL readers"
readme = "README.md"
authors = [{ name = "James Abel", email = "j@abel.co" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["sqlite", "multithread", "multiprocess", "wal", "concurrency"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3.16",
  "Typing :: Typed",
  "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Source = "https://github.com/jamesabel/msqlite"
Changelog = "https://github.com/jamesabel/msqlite/blob/main/CHANGELOG.md"

[dependency-groups]
# Installed by `uv sync`; the package itself has no dependencies.
dev = [
    # testing
    "beartype",
    "coverage",
    "pytest",
    "pytest-xdist",
    "pytest-pycharm",
    "pytest-cov",
    # linters
    "ruff",
    # mypy runs in the lint job (3.15). Its compiled helper librt has no wheel for the 3.16 pre-release yet,
    # and nothing is built from source, so the marker keeps mypy out of the 3.16 environment.
    "mypy; python_version < '3.16'",
]

[tool.ruff]
line-length = 192
target-version = "py312"

[tool.ruff.format]
exclude = ["test_msqlite/test_indexes.py"]  # pre-existing human-owned test kept byte-for-byte

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PYI"]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"test_msqlite/*" = ["I001", "SIM117", "B018", "RUF046"]  # existing tests keep their import order and style; nested with-blocks and bare expressions are deliberate

[tool.mypy]
files = ["src/msqlite"]
python_version = "3.12"
strict = true
