name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked --no-build
      - run: uv run ruff check src test_msqlite scripts
      - run: uv run ruff format --check src test_msqlite scripts
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # a pre-release failure must not cancel the stable runs
      matrix:
        # Policy: test on the minimum supported version, the latest stable release and the
        # upcoming pre-release. Update when a new Python is released or a pre-release appears.
        python-version: ["3.12", "3.15", "3.16"]
    steps:
      - uses: actions/checkout@v4
      # uv installs the interpreter: it ships a pre-release Python (python-build-standalone) weeks
      # before actions/setup-python has a build for the runner image.
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # Wheels only: a dependency without a wheel for this Python is substituted or the version waits,
      # never built from source.
      - run: uv sync --locked --no-build
      - name: Run tests with coverage
        if: matrix.python-version == '3.15'
        run: |
          uv run pytest --cov=msqlite --cov-report=term | tee coverage.txt
          COVERAGE=$(grep "^TOTAL" coverage.txt | awk '{print $NF}' | tr -d '%')
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
      - name: Run tests
        if: matrix.python-version != '3.15'
        run: uv run pytest
      - name: Update coverage badge
        if: matrix.python-version == '3.15' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 073de6201c5dc8c7d26d464af31c2a4b
          filename: coverage.json
          label: coverage
          message: ${{ env.COVERAGE }}%
          valColorRange: ${{ env.COVERAGE }}
          minColorRange: 50
          maxColorRange: 100
