name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: ruff check src test_msqlite scripts
      - run: ruff format --check src test_msqlite scripts
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Policy: test on the minimum supported version, the latest stable release and the
        # upcoming pre-release. Update when a new Python is released or a pre-release appears.
        python-version: ["3.12", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - name: Run tests with coverage
        if: matrix.python-version == '3.14'
        run: |
          pytest --cov=msqlite --cov-report=term | tee coverage.txt
          COVERAGE=$(grep "^TOTAL" coverage.txt | awk '{print $NF}' | tr -d '%')
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
      - name: Run tests
        if: matrix.python-version != '3.14'
        run: pytest
      - name: Update coverage badge
        if: matrix.python-version == '3.14' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 073de6201c5dc8c7d26d464af31c2a4b
          filename: coverage.json
          label: coverage
          message: ${{ env.COVERAGE }}%
          valColorRange: ${{ env.COVERAGE }}
          minColorRange: 50
          maxColorRange: 100
